<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compare Races · Tri Times</title>
    <script>(function(){var t=localStorage.getItem('theme');if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t;})();</script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>
</head>
<body data-page="compare">
    <div class="container">
        <div class="page-head">
            <h1 id="page-title">Compare races</h1>
            <p class="page-desc">Overlay two races. Each chart says which one is typically faster.</p>
        </div>

        <div class="controls compare-controls">
            <div class="race-selector">
                <div class="race-inputs">
                    <div class="control-group race-select-container">
                        <label for="race-a-select" class="race-label"><span class="race-dot" style="--dot:var(--race-a)"></span>Race A</label>
                        <select id="race-a-select"></select>
                    </div>
                    <div class="control-group">
                        <label for="year-a-select">Year</label>
                        <select id="year-a-select"></select>
                    </div>
                </div>
            </div>

            <div class="race-selector">
                <div class="race-inputs">
                    <div class="control-group race-select-container">
                        <label for="race-b-select" class="race-label"><span class="race-dot" style="--dot:var(--race-b)"></span>Race B</label>
                        <select id="race-b-select"></select>
                    </div>
                    <div class="control-group">
                        <label for="year-b-select">Year</label>
                        <select id="year-b-select"></select>
                    </div>
                </div>
            </div>

            <div class="control-group">
                <label for="division-select">Division</label>
                <select id="division-select"></select>
            </div>
        </div>
        <div id="compare-legend" class="compare-legend"></div>

        <div class="charts-grid">
            <div class="chart-container" id="swim-chart">
                <div class="chart-head"><h3>Swim</h3><div class="chart-stats"></div></div><div class="chart-sub"></div>
            </div>
            <div class="chart-container" id="t1-chart">
                <div class="chart-head"><h3>T1</h3><div class="chart-stats"></div></div><div class="chart-sub"></div>
            </div>
            <div class="chart-container" id="bike-chart">
                <div class="chart-head"><h3>Bike</h3><div class="chart-stats"></div></div><div class="chart-sub"></div>
            </div>
            <div class="chart-container" id="t2-chart">
                <div class="chart-head"><h3>T2</h3><div class="chart-stats"></div></div><div class="chart-sub"></div>
            </div>
            <div class="chart-container" id="run-chart">
                <div class="chart-head"><h3>Run</h3><div class="chart-stats"></div></div><div class="chart-sub"></div>
            </div>
            <div class="chart-container" id="finish-chart">
                <div class="chart-head"><h3>Overall</h3><div class="chart-stats"></div></div><div class="chart-sub"></div>
            </div>
        </div>

        <div class="tooltip" id="tooltip"></div>
    </div>

    <script src="js/nav.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/histogram.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/compare.js"></script>
</body>
</html>
