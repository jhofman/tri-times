name: Update race data

on:
  schedule:
    - cron: "23 10 * * 1"
  workflow_dispatch:

concurrency:
  group: weekly-race-update
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Resume existing update pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          UPDATE_BRANCH: automation/weekly-race-update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          pr_number="$(gh pr list \
            --head "$UPDATE_BRANCH" \
            --base "$BASE_BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number')"

          if [[ -n "$pr_number" ]]; then
            git fetch origin "$UPDATE_BRANCH:refs/remotes/origin/$UPDATE_BRANCH"
            git switch -C "$UPDATE_BRANCH" "origin/$UPDATE_BRANCH"
            git merge --no-edit "origin/$BASE_BRANCH"
          fi

      - name: Refresh race list
        run: npm run fetch-race-list

      - name: Fetch missing current-year results
        id: fetch-results
        continue-on-error: true
        run: npm run fetch-new-results

      - name: Regenerate derived data
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- results/*.csv)" ]]; then
            npm run update-manifest
          else
            echo "No new result files; derived data is already current."
          fi

      - name: Validate generated data
        run: |
          node --check scripts/fetch-race-list.js
          node --check scripts/scraper.js
          node --check scripts/update-manifest.js
          node -e "JSON.parse(require('fs').readFileSync('results/races.json'))"
          node -e "JSON.parse(require('fs').readFileSync('results/race-stats.json'))"
          git diff --check

      - name: Commit and open update pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          UPDATE_BRANCH: automation/weekly-race-update
          RESULT_FETCH_OUTCOME: ${{ steps.fetch-results.outcome }}
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- races.txt results)" ]]; then
            echo "Race data is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ "$(git branch --show-current)" != "$UPDATE_BRANCH" ]]; then
            git switch -c "$UPDATE_BRANCH"
          fi
          git add races.txt results
          git commit -m "Update weekly race data"
          git push --force-with-lease origin "HEAD:$UPDATE_BRANCH"

          cat > "$RUNNER_TEMP/pr-body.md" <<EOF
          ## Weekly race data update

          - Refreshed the Ironman 70.3 race list
          - Added missing $(date -u +%Y) results for active and previously tracked races
          - Regenerated race statistics and athlete indexes when result data changed
          - Result fetch step: $RESULT_FETCH_OUTCOME

          Generated by the [weekly race update workflow]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID).
          EOF

          pr_number="$(gh pr list \
            --head "$UPDATE_BRANCH" \
            --base "$BASE_BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number')"

          if [[ -n "$pr_number" ]]; then
            gh pr edit "$pr_number" \
              --title "Update weekly race data" \
              --body-file "$RUNNER_TEMP/pr-body.md"
          else
            gh pr create \
              --base "$BASE_BRANCH" \
              --head "$UPDATE_BRANCH" \
              --title "Update weekly race data" \
              --body-file "$RUNNER_TEMP/pr-body.md"
          fi
