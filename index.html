<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Single Race · Tri Times</title>
    <script>(function(){var t=localStorage.getItem('theme');if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t;})();</script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>
</head>
<body data-page="race">
    <div class="container">
        <div class="page-head">
            <h1 id="page-title">Single race</h1>
            <p class="page-desc">Split time distributions for one race. Highlight an athlete to see where they land.</p>
        </div>

        <div class="controls">
            <div class="control-group race-select-container">
                <label for="race-select">Race</label>
                <select id="race-select"></select>
            </div>
            <div class="control-group">
                <label for="year-select">Year</label>
                <select id="year-select"></select>
            </div>
            <div class="control-group">
                <label for="division-select">Division</label>
                <select id="division-select"></select>
            </div>
            <div class="control-group" id="athlete-select-container">
                <label for="athlete-select">Highlight Athlete</label>
                <select id="athlete-select"></select>
            </div>
            <div class="stats" id="stats"></div>
        </div>

        <div class="charts-grid">
            <div class="chart-container" id="swim-chart">
                <div class="chart-head"><h3>Swim</h3><div class="chart-stats"></div></div>
                <div class="chart-sub"></div>
            </div>
            <div class="chart-container" id="t1-chart">
                <div class="chart-head"><h3>T1</h3><div class="chart-stats"></div></div>
                <div class="chart-sub"></div>
            </div>
            <div class="chart-container" id="bike-chart">
                <div class="chart-head"><h3>Bike</h3><div class="chart-stats"></div></div>
                <div class="chart-sub"></div>
            </div>
            <div class="chart-container" id="t2-chart">
                <div class="chart-head"><h3>T2</h3><div class="chart-stats"></div></div>
                <div class="chart-sub"></div>
            </div>
            <div class="chart-container" id="run-chart">
                <div class="chart-head"><h3>Run</h3><div class="chart-stats"></div></div>
                <div class="chart-sub"></div>
            </div>
            <div class="chart-container" id="finish-chart">
                <div class="chart-head"><h3>Overall</h3><div class="chart-stats"></div></div>
                <div class="chart-sub"></div>
            </div>
        </div>

        <div class="tooltip" id="tooltip"></div>
    </div>

    <script src="js/nav.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/histogram.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
