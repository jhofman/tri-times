<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Race Predictor · Tri Times</title>
    <script>(function(){var t=localStorage.getItem('theme');if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t;})();</script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>
</head>
<body data-page="predict">
    <div class="container">
        <div class="page-head">
            <h1 id="page-title">Race predictor</h1>
            <p class="page-desc">Project a finish time from an athlete's percentile profile.</p>
        </div>

        <div class="controls">
            <div class="control-group athlete-search-control" style="flex: 1; max-width: 280px;">
                <label for="athlete-search">Athlete</label>
                <div class="search-input-wrapper">
                    <input type="text" id="athlete-search" placeholder="Search athlete..." autocomplete="off">
                    <button id="clear-athlete" class="clear-btn" style="display: none;" title="Clear" aria-label="Clear athlete"></button>
                </div>
                <div id="search-results" class="search-results"></div>
            </div>
            <div class="control-group race-select-container">
                <label for="race-select">Race</label>
                <select id="race-select"></select>
            </div>
            <div class="control-group">
                <label for="year-select">Year</label>
                <select id="year-select"></select>
            </div>
        </div>

        <p id="predict-description" class="predict-description" style="display: none;"></p>

        <div class="predict-layout">
            <section class="predict-card predict-inputs">
                <h2>Percentile profile</h2>
                <p class="predict-help">Lower percentile = faster. Select an athlete to auto-fill from their race history, or adjust the values manually.</p>
                <div class="percentile-grid">
                <div class="pctl-input-group">
                    <label for="pctl-swim">Swim</label>
                    <div class="pctl-input-wrapper">
                        <input type="number" id="pctl-swim" min="1" max="99" value="50" class="pctl-input">
                        <span class="pctl-suffix">%</span>
                        <input type="range" id="pctl-swim-range" min="1" max="99" value="50" class="pctl-range" aria-label="Swim percentile">
                    </div>
                </div>
                <div class="pctl-input-group">
                    <label for="pctl-t1">T1</label>
                    <div class="pctl-input-wrapper">
                        <input type="number" id="pctl-t1" min="1" max="99" value="50" class="pctl-input">
                        <span class="pctl-suffix">%</span>
                        <input type="range" id="pctl-t1-range" min="1" max="99" value="50" class="pctl-range" aria-label="T1 percentile">
                    </div>
                </div>
                <div class="pctl-input-group">
                    <label for="pctl-bike">Bike</label>
                    <div class="pctl-input-wrapper">
                        <input type="number" id="pctl-bike" min="1" max="99" value="50" class="pctl-input">
                        <span class="pctl-suffix">%</span>
                        <input type="range" id="pctl-bike-range" min="1" max="99" value="50" class="pctl-range" aria-label="Bike percentile">
                    </div>
                </div>
                <div class="pctl-input-group">
                    <label for="pctl-t2">T2</label>
                    <div class="pctl-input-wrapper">
                        <input type="number" id="pctl-t2" min="1" max="99" value="50" class="pctl-input">
                        <span class="pctl-suffix">%</span>
                        <input type="range" id="pctl-t2-range" min="1" max="99" value="50" class="pctl-range" aria-label="T2 percentile">
                    </div>
                </div>
                <div class="pctl-input-group">
                    <label for="pctl-run">Run</label>
                    <div class="pctl-input-wrapper">
                        <input type="number" id="pctl-run" min="1" max="99" value="50" class="pctl-input">
                        <span class="pctl-suffix">%</span>
                        <input type="range" id="pctl-run-range" min="1" max="99" value="50" class="pctl-range" aria-label="Run percentile">
                    </div>
                </div>
            </div>
            </section>

            <section id="projection" class="predict-card projection" style="display: none;">
                <h2 id="projection-heading">Projection</h2>
                <div id="finish-time" class="finish-time"></div>
                <div id="finish-pctl" class="finish-context"></div>
                <div id="projection-body" class="projection-list"></div>
            </section>
        </div>
    </div>

    <script src="js/nav.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/predict.js"></script>
</body>
</html>
