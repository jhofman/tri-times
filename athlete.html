<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Athlete Search · Tri Times</title>
    <script>(function(){var t=localStorage.getItem('theme');if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t;})();</script>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body data-page="athlete">
    <div class="container">
        <div class="page-head">
            <h1 id="page-title">Athlete search</h1>
            <p class="page-desc">Every result for an athlete, with the percentile of each split.</p>
        </div>

        <div class="controls">
            <div class="control-group athlete-search-control" style="flex: 1; max-width: 400px;">
                <label for="athlete-search">Search Athlete</label>
                <div class="search-input-wrapper">
                    <input type="text" id="athlete-search" placeholder="Type a name..." autocomplete="off">
                    <button id="clear-search" class="clear-btn" style="display: none;" title="Clear" aria-label="Clear athlete search"></button>
                </div>
                <div id="search-results" class="search-results"></div>
            </div>
            <div class="stats" id="stats"></div>
        </div>

        <div id="athlete-results" style="display: none;">
            <div class="athlete-result-head">
                <h2 id="athlete-name"></h2>
                <a id="predict-athlete" class="button-link" href="predict.html">Predict race time →</a>
            </div>
            <div class="table-wrapper">
                <table class="race-table" id="results-table">
                    <thead>
                        <tr>
                            <th data-sort="race">Race <span class="sort-arrow"></span></th>
                            <th data-sort="year" class="num">Year <span class="sort-arrow"></span></th>
                            <th data-sort="division">Division <span class="sort-arrow"></span></th>
                            <th data-sort="swim" class="num">Swim <span class="sort-arrow"></span></th>
                            <th data-sort="t1" class="num">T1 <span class="sort-arrow"></span></th>
                            <th data-sort="bike" class="num">Bike <span class="sort-arrow"></span></th>
                            <th data-sort="t2" class="num">T2 <span class="sort-arrow"></span></th>
                            <th data-sort="run" class="num">Run <span class="sort-arrow"></span></th>
                            <th data-sort="finish" class="num">Finish <span class="sort-arrow"></span></th>
                        </tr>
                    </thead>
                    <tbody id="results-table-body"></tbody>
                    <tfoot id="results-table-foot"></tfoot>
                </table>
            </div>
        </div>
    </div>

    <script src="js/nav.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/athlete-lookup.js"></script>
</body>
</html>
