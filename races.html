<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Races · Tri Times</title>
    <script>(function(){var t=localStorage.getItem('theme');if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t;})();</script>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body data-page="races">
    <div class="container">
        <div class="page-head">
            <h1 id="page-title">All races</h1>
            <p class="page-desc">Median (or any percentile) split times for every race in the archive.</p>
        </div>

        <div class="controls">
            <div class="control-group">
                <label for="percentile-select">Percentile</label>
                <select id="percentile-select">
                    <option value="5">5th (fastest)</option>
                    <option value="10">10th</option>
                    <option value="15">15th</option>
                    <option value="20">20th</option>
                    <option value="25">25th</option>
                    <option value="30">30th</option>
                    <option value="35">35th</option>
                    <option value="40">40th</option>
                    <option value="45">45th</option>
                    <option value="50" selected>50th (median)</option>
                    <option value="55">55th</option>
                    <option value="60">60th</option>
                    <option value="65">65th</option>
                    <option value="70">70th</option>
                    <option value="75">75th</option>
                    <option value="80">80th</option>
                    <option value="85">85th</option>
                    <option value="90">90th</option>
                    <option value="95">95th (slowest)</option>
                </select>
            </div>
            <div id="percentile-description" class="toolbar-note">Showing 50th percentile (median) split times.</div>
            <div class="stats" id="stats"></div>
        </div>

        <div class="table-wrapper">
            <table class="race-table" id="race-table">
                <thead>
                    <tr>
                        <th data-sort="name">Race <span class="sort-arrow"></span></th>
                        <th data-sort="yearCount" class="num">Years <span class="sort-arrow"></span></th>
                        <th data-sort="swim" class="num">Swim <span class="sort-arrow"></span></th>
                        <th data-sort="t1" class="num">T1 <span class="sort-arrow"></span></th>
                        <th data-sort="bike" class="num">Bike <span class="sort-arrow"></span></th>
                        <th data-sort="t2" class="num">T2 <span class="sort-arrow"></span></th>
                        <th data-sort="run" class="num">Run <span class="sort-arrow"></span></th>
                        <th data-sort="finish" class="num">Finish <span class="sort-arrow"></span></th>
                    </tr>
                </thead>
                <tbody id="race-table-body"></tbody>
            </table>
        </div>
    </div>

    <script src="js/nav.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/races.js"></script>
</body>
</html>
